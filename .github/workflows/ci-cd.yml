name: CI/CD

# PR (dev/master): só build + testes. Push em dev/master: build + testes + migrations + deploy.
# dev publica recursos -dev (imagem :dev); master publica prod (imagem :latest).
# Variáveis por ambiente (Settings > Environments > dev|prod) substituem os variable groups do
# Azure: AWS_ROLE_ARN, IMAGE_TAG, SUPABASE_PROJECT_REF e os *_SERVICE. AWS_REGION e ECR_REGISTRY
# são variáveis do repositório. O secret SUPABASE_ACCESS_TOKEN também vive no environment.
# AWS por OIDC (sem access key) — ver infra/github-oidc/README.md.
#
# Interruptor: enquanto a variável de repositório DEPLOY_ENABLED não for 'true', só roda o gate
# de build/testes. Evita deploy duplicado enquanto o Azure Pipelines ainda está ativo.

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por branch por vez; um deploy em andamento nunca é cancelado no meio.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - run: dotnet build GiomCaptionVideos.sln --configuration Release

      - run: dotnet test GiomCaptionVideos.sln --configuration Release --no-build

      # A Lambda do webhook do WhatsApp é o único controle de acesso de um endpoint público —
      # se a validação de assinatura quebrar, qualquer um injeta mensagem na fila do bot.
      - name: Testes da Lambda do webhook
        run: python -m unittest discover -s infra/lambda-whatsapp-webhook -v

  migrations:
    name: Migrations + Edge Functions
    needs: build-test
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Migrations + Edge Functions ANTES do deploy da imagem: código novo que depende de schema
      # novo não deve subir antes do schema existir. `supabase db push` só aplica o que ainda
      # não foi registrado (idempotente). `bash -e` (padrão do Actions) para no primeiro erro —
      # um db push falho nunca pode seguir pro deploy das functions.
      - name: Supabase — aplicar migrations + deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          supabase db push
          supabase functions deploy buscar-similar --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

  deploy:
    name: Deploy — ${{ matrix.name }}
    needs: migrations
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}
    permissions:
      contents: read
      id-token: write # OIDC com a AWS
    strategy:
      fail-fast: false
      matrix:
        include:
          # service_var = nome da variável do environment com o ECS Service a reiniciar. Vazio:
          # a imagem só é publicada (Ingestão roda como task; o bot é reiniciado no job final).
          - { name: giom-ingestao, dockerfile: src/Giom.VideoManager.Ingestao.Worker/Dockerfile, service_var: "" }
          - { name: giom-agenteinstituto, dockerfile: src/Giom.VideoManager.AgenteInstituto.Worker/Dockerfile, service_var: "" }
          - { name: giom-transcricao, dockerfile: src/Giom.VideoManager.Transcricao.Worker/Dockerfile, service_var: TRANSCRICAO_SERVICE }
          - { name: giom-resumo, dockerfile: src/Giom.VideoManager.Resumo.Worker/Dockerfile, service_var: RESUMO_SERVICE }
          - { name: giom-categorizacao, dockerfile: src/Giom.VideoManager.Categorizacao.Worker/Dockerfile, service_var: CATEGORIZACAO_SERVICE }
          - { name: giom-embedding, dockerfile: src/Giom.VideoManager.Embedding.Worker/Dockerfile, service_var: EMBEDDING_SERVICE }
          - { name: giom-orquestracao, dockerfile: src/Giom.VideoManager.Orquestracao.Worker/Dockerfile, service_var: ORQUESTRACAO_SERVICE }
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build e push — ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: BUILD_ID=${{ github.run_number }}
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ matrix.name }}:${{ github.run_number }}
            ${{ vars.ECR_REGISTRY }}/${{ matrix.name }}:${{ vars.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # O ECS Service não puxa imagem nova sozinho — só num novo deploy ou scale-out.
      - name: Forçar novo deploy — ECS Service ${{ matrix.name }}
        if: matrix.service_var != ''
        run: |
          aws ecs update-service --cluster giom-cluster \
            --service "${{ vars[matrix.service_var] }}" \
            --force-new-deployment --region "${{ vars.AWS_REGION }}" \
            --query 'service.serviceName' --output text

  deploy-bot:
    name: Deploy — bot (reinício)
    needs: deploy
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # O bot fica sempre ligado: precisa reiniciar pra puxar a imagem nova, e só depois de
      # TODAS as imagens publicadas.
      - name: Forçar novo deploy — GiomAgenteInstituto
        run: |
          aws ecs update-service --cluster giom-cluster \
            --service "${{ vars.AGENTEINSTITUTO_SERVICE }}" \
            --force-new-deployment --region "${{ vars.AWS_REGION }}" \
            --query 'service.serviceName' --output text
