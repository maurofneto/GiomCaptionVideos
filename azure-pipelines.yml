# A página web/reconexao tem pipeline próprio (web/reconexao/azure-pipelines.yml), então mudança
# só em web/** não builda o .NET nem aplica migration por aqui. Mudança em supabase/** continua
# disparando esta pipeline, que é quem aplica as migrations (stage Migrations). Não há bloco
# "pr:" de propósito: no Azure Repos a validação de PR é por branch policy.
trigger:
  branches:
    include:
      - master
      - dev
  paths:
    exclude:
      - web/**

pool:
  vmImage: ubuntu-latest

variables:
  # AWS_REGION/ECR_REGISTRY vêm do group giom-aws (não variam por branch — mesma conta/registro
  # pra dev e prod). AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY continuam como variáveis secretas
  # do pipeline (Pipelines > Edit > Variables), NÃO ficam neste arquivo nem em variable group.
  # User: giom-ci-deploy, permissão de push em qualquer repositório ECR "giom-*" (wildcard —
  # evita ter que editar a policy toda vez que um worker novo ganha repositório próprio, ver
  # Feature #104) e ecs:UpdateService nos services do AgenteInstituto e (migração 2026-07,
  # infra/ecs-services-etapas/) nos 10 Services de etapa (transcricao/resumo/categorizacao/
  # embedding/orquestracao × dev/prod). A Lambda watchman (giom-fila-watchman/-dev) foi
  # decommissionada nessa mesma migração — substituída por ECS Service + Application Auto
  # Scaling, ver infra/ecs-services-etapas/README.md — por isso não há mais stage Lambda nem
  # permissão lambda:UpdateFunctionCode aqui.
  - group: giom-aws
  #
  # branch dev publica recursos -dev (imagem :dev, service giom-agenteinstituto-dev-service);
  # master publica prod (imagem :latest, service giom-agenteinstituto-service) e só recebe
  # commits via PR aprovado (branch policy no Azure Repos). IMAGE_TAG/AGENTEINSTITUTO_SERVICE
  # vêm de variable groups (Pipelines > Library) em vez de hardcoded aqui — trocar de ambiente
  # (ou adicionar um terceiro) vira só um novo group, sem editar este arquivo.
  #
  # Ambos os "if" abaixo comparam com igualdade explícita (nunca "!= dev") — sem isso, uma
  # branch qualquer (ex.: enfileirada manualmente pra validar este YAML) cairia no "senão" e
  # seria tratada como prod, forçando deploy no service de produção sem querer. Cada stage abaixo
  # também só roda em dev/master (condition) — qualquer outra branch simplesmente não builda nem
  # publica nada. Variáveis declaradas aqui na raiz (grupos incluídos) ficam visíveis em TODAS as
  # stages/jobs do pipeline, não precisa redeclarar por stage.
  - ${{ if eq(variables['Build.SourceBranchName'], 'dev') }}:
      - group: giom-dev
  - ${{ if eq(variables['Build.SourceBranchName'], 'master') }}:
      - group: giom-prod

# Dividido em stages (era um job único "BuildAndDeploy") pra dar visibilidade de cada etapa
# direto na lista de execuções do pipeline — cada stage aparece como um bloco separado no
# resumo/diagrama do run, sem precisar abrir log nenhum pra saber o que rodou ou o que quebrou
# (foi assim que a causa raiz do build 113 só apareceu depois de abrir o log inteiro).
#
# Ordem: Build (gate — se dotnet test falhar, nada mais roda) -> Migrations -> Deploy 1..9, um
# por imagem Docker, todas em paralelo (só dependem de Migrations, porque código novo pode
# depender de schema novo) -> Deploy Bot (força o restart do bot, só depois de TODAS as imagens
# publicadas).
stages:
  - stage: Build
    displayName: 'Build'
    condition: or(eq(variables['Build.SourceBranchName'], 'master'), eq(variables['Build.SourceBranchName'], 'dev'))
    jobs:
      - job: BuildETestar
        displayName: 'dotnet build + test'
        steps:
          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '9.0.x'

          - script: dotnet build GiomCaptionVideos.sln --configuration Release
            displayName: 'dotnet build'

          - script: dotnet test GiomCaptionVideos.sln --configuration Release --no-build
            displayName: 'dotnet test'

          # A Lambda do webhook do WhatsApp (Task #140) é o único controle de acesso de um
          # endpoint público — se a validação de assinatura quebrar, qualquer um injeta mensagem
          # na fila do bot. Roda aqui junto do gate pra isso não passar despercebido.
          - script: python -m unittest discover -s infra/lambda-whatsapp-webhook -v
            displayName: 'python -m unittest (lambda do webhook)'

  - stage: Migrations
    displayName: 'Migrations'
    dependsOn: Build
    condition: or(eq(variables['Build.SourceBranchName'], 'master'), eq(variables['Build.SourceBranchName'], 'dev'))
    jobs:
      - job: AplicarMigrations
        displayName: 'Aplicar migrations + Edge Functions'
        steps:
          # Migrations ANTES do deploy da imagem nova — código novo que depende de schema novo (ex.:
          # coluna "origem" em video_chunk) não deve subir antes do schema existir. O MOTOR (Supabase ou
          # Postgres/Railway) é escolhido por ambiente via variable group (DB_ENGINE) — ver o template.
          - template: pipelines/templates/migrar-banco.yml

  - stage: Deploy1
    displayName: 'Deploy 1 — giom-ingestao'
    dependsOn: Migrations
    condition: or(eq(variables['Build.SourceBranchName'], 'master'), eq(variables['Build.SourceBranchName'], 'dev'))
    jobs:
      - job: BuildEPush
        displayName: 'Build e push'
        steps:
          - template: pipelines/templates/deploy-imagem.yml
            parameters:
              serviceName: giom-ingestao
              dockerfilePath: src/Giom.VideoManager.Ingestao.Worker/Dockerfile

  - stage: Deploy4
    displayName: 'Deploy 4 — giom-agenteinstituto'
    dependsOn: Migrations
    condition: or(eq(variables['Build.SourceBranchName'], 'master'), eq(variables['Build.SourceBranchName'], 'dev'))
    jobs:
      - job: BuildEPush
        displayName: 'Build e push'
        steps:
          - template: pipelines/templates/deploy-imagem.yml
            parameters:
              serviceName: giom-agenteinstituto
              dockerfilePath: src/Giom.VideoManager.AgenteInstituto.Worker/Dockerfile

  # Feature #104 — workers de etapa (Transcrição/Resumo/Categorização/Embedding) + orquestrador.
  # Cada imagem é única (não duplicada por canal) — Instituto e Ministério compartilham a mesma
  # imagem. Migração 2026-07 (infra/ecs-services-etapas/): trigger deixou de ser a Lambda
  # watchman + run-task sob demanda e virou ECS Service de longa duração + Application Auto
  # Scaling por profundidade de fila — por isso cada stage agora também força um redeploy do
  # Service (mesmo padrão do stage DeployBot pro bot), senão o Service continuaria rodando a
  # imagem antiga indefinidamente (Service não puxa imagem nova sozinho, só em novo deploy ou
  # scale-out). *_SERVICE vem do variable group por branch (giom-dev/giom-prod), mesmo padrão de
  # AGENTEINSTITUTO_SERVICE — precisa existir lá antes deste stage funcionar (giom-{etapa}-dev-
  # service em giom-dev, giom-{etapa}-service em giom-prod).
  - stage: Deploy5
    displayName: 'Deploy 5 — giom-transcricao'
    dependsOn: Migrations
    condition: or(eq(variables['Build.SourceBranchName'], 'master'), eq(variables['Build.SourceBranchName'], 'dev'))
    jobs:
      - job: BuildEPush
        displayName: 'Build e push'
        steps:
          - template: pipelines/templates/deploy-imagem.yml
            parameters:
              serviceName: giom-transcricao
              dockerfilePath: src/Giom.VideoManager.Transcricao.Worker/Dockerfile
          - script: |
              command -v aws >/dev/null 2>&1 || pip install --user awscli
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: 'Garantir AWS CLI disponível'
          - script: |
              aws ecs update-service --cluster giom-cluster --service $(TRANSCRICAO_SERVICE) --force-new-deployment --region $(AWS_REGION)
            displayName: 'Forçar novo deploy — ECS Service giom-transcricao'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

  - stage: Deploy6
    displayName: 'Deploy 6 — giom-resumo'
    dependsOn: Migrations
    condition: or(eq(variables['Build.SourceBranchName'], 'master'), eq(variables['Build.SourceBranchName'], 'dev'))
    jobs:
      - job: BuildEPush
        displayName: 'Build e push'
        steps:
          - template: pipelines/templates/deploy-imagem.yml
            parameters:
              serviceName: giom-resumo
              dockerfilePath: src/Giom.VideoManager.Resumo.Worker/Dockerfile
          - script: |
              command -v aws >/dev/null 2>&1 || pip install --user awscli
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: 'Garantir AWS CLI disponível'
          - script: |
              aws ecs update-service --cluster giom-cluster --service $(RESUMO_SERVICE) --force-new-deployment --region $(AWS_REGION)
            displayName: 'Forçar novo deploy — ECS Service giom-resumo'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

  - stage: Deploy7
    displayName: 'Deploy 7 — giom-categorizacao'
    dependsOn: Migrations
    condition: or(eq(variables['Build.SourceBranchName'], 'master'), eq(variables['Build.SourceBranchName'], 'dev'))
    jobs:
      - job: BuildEPush
        displayName: 'Build e push'
        steps:
          - template: pipelines/templates/deploy-imagem.yml
            parameters:
              serviceName: giom-categorizacao
              dockerfilePath: src/Giom.VideoManager.Categorizacao.Worker/Dockerfile
          - script: |
              command -v aws >/dev/null 2>&1 || pip install --user awscli
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: 'Garantir AWS CLI disponível'
          - script: |
              aws ecs update-service --cluster giom-cluster --service $(CATEGORIZACAO_SERVICE) --force-new-deployment --region $(AWS_REGION)
            displayName: 'Forçar novo deploy — ECS Service giom-categorizacao'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

  - stage: Deploy8
    displayName: 'Deploy 8 — giom-embedding'
    dependsOn: Migrations
    condition: or(eq(variables['Build.SourceBranchName'], 'master'), eq(variables['Build.SourceBranchName'], 'dev'))
    jobs:
      - job: BuildEPush
        displayName: 'Build e push'
        steps:
          - template: pipelines/templates/deploy-imagem.yml
            parameters:
              serviceName: giom-embedding
              dockerfilePath: src/Giom.VideoManager.Embedding.Worker/Dockerfile
          - script: |
              command -v aws >/dev/null 2>&1 || pip install --user awscli
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: 'Garantir AWS CLI disponível'
          - script: |
              aws ecs update-service --cluster giom-cluster --service $(EMBEDDING_SERVICE) --force-new-deployment --region $(AWS_REGION)
            displayName: 'Forçar novo deploy — ECS Service giom-embedding'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

  - stage: Deploy9
    displayName: 'Deploy 9 — giom-orquestracao'
    dependsOn: Migrations
    condition: or(eq(variables['Build.SourceBranchName'], 'master'), eq(variables['Build.SourceBranchName'], 'dev'))
    jobs:
      - job: BuildEPush
        displayName: 'Build e push'
        steps:
          - template: pipelines/templates/deploy-imagem.yml
            parameters:
              serviceName: giom-orquestracao
              dockerfilePath: src/Giom.VideoManager.Orquestracao.Worker/Dockerfile
          - script: |
              command -v aws >/dev/null 2>&1 || pip install --user awscli
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: 'Garantir AWS CLI disponível'
          - script: |
              aws ecs update-service --cluster giom-cluster --service $(ORQUESTRACAO_SERVICE) --force-new-deployment --region $(AWS_REGION)
            displayName: 'Forçar novo deploy — ECS Service giom-orquestracao'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

  - stage: DeployBot
    displayName: 'Deploy Bot'
    dependsOn: [Deploy1, Deploy4, Deploy5, Deploy6, Deploy7, Deploy8, Deploy9]
    condition: or(eq(variables['Build.SourceBranchName'], 'master'), eq(variables['Build.SourceBranchName'], 'dev'))
    jobs:
      - job: ForcarNovoDeploy
        displayName: 'Forçar novo deploy'
        steps:
          - script: |
              command -v aws >/dev/null 2>&1 || pip install --user awscli
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: 'Garantir AWS CLI disponível'

          - script: |
              aws ecs update-service --cluster giom-cluster --service $(AGENTEINSTITUTO_SERVICE) --force-new-deployment --region $(AWS_REGION)
            displayName: 'Forçar novo deploy — GiomAgenteInstituto (bot fica sempre ligado, precisa reiniciar pra puxar a imagem nova)'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
