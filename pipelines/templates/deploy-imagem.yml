parameters:
  - name: serviceName
    type: string
  - name: dockerfilePath
    type: string

# Usado por cada stage Deploy N (uma por serviço, ver azure-pipelines.yml) — cada uma roda em
# agente próprio, então precisa repetir CLI + login do zero (não dá pra compartilhar estado entre
# stages/agentes diferentes).
steps:
  - script: |
      command -v aws >/dev/null 2>&1 || pip install --user awscli
      echo "##vso[task.prependpath]$HOME/.local/bin"
    displayName: 'Garantir AWS CLI disponível'

  - script: |
      aws ecr get-login-password --region $(AWS_REGION) | docker login --username AWS --password-stdin $(ECR_REGISTRY)
    displayName: 'Login no ECR'
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

  - script: |
      docker build -f ${{ parameters.dockerfilePath }} \
        --build-arg BUILD_ID=$(Build.BuildId) \
        -t $(ECR_REGISTRY)/${{ parameters.serviceName }}:$(Build.BuildId) \
        -t $(ECR_REGISTRY)/${{ parameters.serviceName }}:$(IMAGE_TAG) .
      docker push $(ECR_REGISTRY)/${{ parameters.serviceName }}:$(Build.BuildId)
      docker push $(ECR_REGISTRY)/${{ parameters.serviceName }}:$(IMAGE_TAG)
    displayName: 'Build e push — ${{ parameters.serviceName }}'
