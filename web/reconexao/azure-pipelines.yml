# Pipeline da página de reconexão (web/reconexao) — SEPARADO do azure-pipelines.yml raiz (.NET/AWS).
#
# O Mauro precisa REGISTRAR este pipeline no ADO (Pipelines > New pipeline > Azure Repos Git >
# Existing Azure Pipelines YAML file > /web/reconexao/azure-pipelines.yml). Pré-requisitos (fora
# do código, ver web/reconexao/README.md):
#   - Variable group "giom-reconexao" (Pipelines > Library) com VERCEL_TOKEN (secreto),
#     VERCEL_ORG_ID, VERCEL_PROJECT_ID e RECONEXAO_PREVIEW_ALIAS (domínio fixo de Preview, sem
#     https://, ex.: reconexao-dev.exemplo.com). NUNCA colocar token/IDs neste arquivo.
#     Opcional: VERCEL_SCOPE (slug do time) — vira `--scope` só quando definido.
#   - Environment "reconexao-prod" (Pipelines > Environments) com Approvals and checks => aprovação
#     manual antes do deploy de produção.
#   - Projeto Vercel com Root Directory VAZIO: o CLI roda DENTRO de web/reconexao, então o
#     conteúdo enviado é só este app (nada do código .NET sobe pra Vercel).
#   - Env vars do app configuradas no projeto Vercel (Preview = dev, Production = prod).

# Separação de builds: o pipeline RAIZ (.NET + migrations) exclui `web/**` do próprio trigger
# (PR-03b), então mexer na página nunca builda o .NET; e este pipeline só dispara com mudanças em
# web/reconexao/**, então mexer no .NET nunca builda/deploya a página. Por isso aqui há só
# `paths.include`, sem exclude e sem outros paths.
trigger:
  branches:
    include:
      - master
      - dev
  paths:
    include:
      - web/reconexao/**

pool:
  vmImage: ubuntu-latest

variables:
  - group: giom-reconexao
  # Versão FIXA do Vercel CLI (nunca "latest": o deploy tem que ser reproduzível). Precisa ser
  # recente o bastante para ler VERCEL_TOKEN do ambiente sem cair no prompt de login (48.x não lê).
  # 63.1.0 era a última estável no npm (`npm view vercel version`) em 2026-10-08.
  - name: vercelCliVersion
    value: '63.1.0'
  - name: nodeVersion
    value: '24.x'
  # As conditions dos stages de deploy seguem a regra do pipeline raiz — igualdade explícita,
  # nunca "!= dev" (senão qualquer outra branch cairia no "senão" e viraria deploy de produção).
  # Comparam o ref COMPLETO (Build.SourceBranch), mais estrito que Build.SourceBranchName:
  # "feature/dev" tem SourceBranchName "dev" mas ref "refs/heads/feature/dev".

stages:
  # Build/test roda em qualquer branch (serve também de validação de PR via branch policy) e não
  # usa nenhum segredo: as env vars abaixo são valores FICTÍCIOS só para o `next build` compilar.
  - stage: Build
    displayName: 'Build e testes'
    jobs:
      - job: BuildETestar
        displayName: 'npm ci + lint + typecheck + test + next build'
        steps:
          # NodeTool@0 está deprecado na doc da Microsoft; a task recomendada é UseNode@1
          # (a entrada se chama `version`, não `versionSpec`).
          - task: UseNode@1
            displayName: 'Instalar Node'
            inputs:
              version: $(nodeVersion)

          - script: npm ci
            displayName: 'npm ci'
            workingDirectory: web/reconexao

          - script: npm run lint
            displayName: 'lint'
            workingDirectory: web/reconexao

          - script: npm run typecheck
            displayName: 'typecheck'
            workingDirectory: web/reconexao

          - script: npm test
            displayName: 'testes (vitest)'
            workingDirectory: web/reconexao

          - script: npm run build
            displayName: 'next build'
            workingDirectory: web/reconexao
            env:
              SESSION_SECRET: build-only-fake-session-secret-0123456789abcdef
              ALLOWED_EMAILS: build@example.invalid
              AUTH_GOOGLE_CLIENT_ID: build-fake
              AUTH_GOOGLE_CLIENT_SECRET: build-fake
              AUTH_REDIRECT_URI: https://build.example.invalid/api/auth/callback
              YOUTUBE_GOOGLE_CLIENT_ID: build-fake
              YOUTUBE_GOOGLE_CLIENT_SECRET: build-fake
              YOUTUBE_REDIRECT_URI: https://build.example.invalid/api/youtube/callback
              OAUTH_APP_MODE: testing
              RECONEXAO_AWS_REGION: us-east-1
              RECONEXAO_AWS_ACCESS_KEY_ID: build-fake
              RECONEXAO_AWS_SECRET_ACCESS_KEY: build-fake
              SSM_PREFIX: /giom/build
              SSM_KMS_KEY_ID: build-fake
              SSM_COOKIES_TIER: Standard
              CANAIS_API_URL: https://build.example.invalid
              CANAIS_API_REST_PREFIX: /rest/v1
              CANAIS_API_TOKEN: build-fake
              CANAIS_API_KEY: build-fake

  # dev => Preview + alias fixo (o redirect URI do Google exige URL exata).
  #
  # ARMADILHA DO PRIMEIRO DEPLOY: a Vercel trata o PRIMEIRO deployment de um projeto novo como
  # PRODUÇÃO mesmo sem `--prod` (vercel.com/docs/cli/deploy, seção Prod). No CLI isso só vale
  # quando NÃO há `--target` (isImplicitProduction = target==="production" && !target). Um deploy
  # que falha (ERROR) não cria produção, então o projeto segue "sem produção" e o próximo deploy
  # sem target explícito cairia em produção de novo. Por isso aqui:
  #   - `vercel pull --environment=preview` + `vercel build` (sem --prod): build no agente com as
  #     env vars de Preview;
  #   - `vercel deploy --prebuilt --target=preview`: target EXPLÍCITO, nunca --prod;
  #   - ANTES do alias, `vercel inspect --json` confirma que o deployment é de Preview; se vier
  #     qualquer outra coisa (ex.: production), o job FALHA e o alias não é aplicado.
  - stage: DeployPreview
    displayName: 'Deploy Preview (dev)'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - job: VercelPreview
        displayName: 'vercel pull/build/deploy (preview) + alias'
        steps:
          - task: UseNode@1
            inputs:
              version: $(nodeVersion)

          - script: |
              set -euo pipefail
              # VERCEL_SCOPE é opcional: variável não definida no group chega como o literal
              # '$(VERCEL_SCOPE)' (macro do ADO sem valor) — tratado como vazio.
              SCOPE_ARGS=()
              if [ -n "${VERCEL_SCOPE:-}" ] && [ "${VERCEL_SCOPE}" != '$(VERCEL_SCOPE)' ]; then
                SCOPE_ARGS=(--scope "${VERCEL_SCOPE}")
              fi
              VERCEL=(npx --yes "vercel@${VERCEL_CLI_VERSION}")

              # Grava .vercel/project.json e .vercel/.env.preview.local (gitignored; NUNCA imprimir).
              "${VERCEL[@]}" pull --yes --environment=preview "${SCOPE_ARGS[@]}"
              # Sem --prod: usa as env vars de Preview.
              "${VERCEL[@]}" build --yes "${SCOPE_ARGS[@]}"
              # stdout do `vercel deploy` é só a URL do deployment; progresso vai pro stderr.
              DEPLOY_URL="$("${VERCEL[@]}" deploy --prebuilt --target=preview "${SCOPE_ARGS[@]}")"
              echo "Deployment: ${DEPLOY_URL}"

              # Guarda: só aplica o alias se o deployment é de Preview. Na API da Vercel o target
              # de Preview é null/"preview"; "production" (ou ambiente custom) falha o job.
              "${VERCEL[@]}" inspect "${DEPLOY_URL}" --json --wait "${SCOPE_ARGS[@]}" > "${AGENT_TEMPDIRECTORY}/inspect.json"
              node -e '
                const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                const o = d.deployment ?? d;
                if (!Object.hasOwn(o, "target")) { console.error("inspect --json sem campo target; abortando sem alias"); process.exit(1); }
                const t = o.target;
                if (t !== null && t !== "preview") { console.error("Deployment NAO eh Preview (target=" + t + "); abortando sem alias"); process.exit(1); }
                console.log("Confirmado: deployment de Preview (target=" + t + ")");
              ' "${AGENT_TEMPDIRECTORY}/inspect.json"

              "${VERCEL[@]}" alias set "${DEPLOY_URL}" "${PREVIEW_ALIAS}" "${SCOPE_ARGS[@]}"
            displayName: 'Vercel pull + build + deploy Preview, checa target, alias set'
            workingDirectory: web/reconexao
            env:
              VERCEL_CLI_VERSION: $(vercelCliVersion)
              VERCEL_SCOPE: $(VERCEL_SCOPE)
              VERCEL_TOKEN: $(VERCEL_TOKEN)
              VERCEL_ORG_ID: $(VERCEL_ORG_ID)
              VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)
              PREVIEW_ALIAS: $(RECONEXAO_PREVIEW_ALIAS)

  # master => Production, num deployment job ligado ao environment "reconexao-prod" (aprovação
  # manual configurada pelo Mauro em Approvals and checks). Build no agente com as env vars de
  # Production (`pull --environment=production` + `build --prod`) e `deploy --prebuilt --prod`.
  - stage: DeployProd
    displayName: 'Deploy Production (master)'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - deployment: VercelProd
        displayName: 'vercel pull/build/deploy --prod'
        environment: 'reconexao-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: UseNode@1
                  inputs:
                    version: $(nodeVersion)

                - script: |
                    set -euo pipefail
                    SCOPE_ARGS=()
                    if [ -n "${VERCEL_SCOPE:-}" ] && [ "${VERCEL_SCOPE}" != '$(VERCEL_SCOPE)' ]; then
                      SCOPE_ARGS=(--scope "${VERCEL_SCOPE}")
                    fi
                    VERCEL=(npx --yes "vercel@${VERCEL_CLI_VERSION}")
                    # Grava .vercel/.env.production.local (gitignored; NUNCA imprimir).
                    "${VERCEL[@]}" pull --yes --environment=production "${SCOPE_ARGS[@]}"
                    "${VERCEL[@]}" build --prod --yes "${SCOPE_ARGS[@]}"
                    "${VERCEL[@]}" deploy --prebuilt --prod "${SCOPE_ARGS[@]}"
                  displayName: 'Vercel pull + build + deploy Production'
                  workingDirectory: web/reconexao
                  env:
                    VERCEL_CLI_VERSION: $(vercelCliVersion)
                    VERCEL_SCOPE: $(VERCEL_SCOPE)
                    VERCEL_TOKEN: $(VERCEL_TOKEN)
                    VERCEL_ORG_ID: $(VERCEL_ORG_ID)
                    VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)
